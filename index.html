<!DOCTYPE html>
<html lang="en">
<head>
	<title>Diogo Corrêa - Senior Frontend Developer</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Diogo Corrêa - Sernior Frontend Software Engineer">
	<meta name="theme-color" content="#1a4667">
	<link rel="shortcut icon" href="/favicon.ico">
	<link rel="manifest" href="/manifest.json">
	<link rel="preload" as="font" href="montserrat.woff2" type="font/woff2" crossorigin>
	<link rel="preconnect" href="https://www.google-analytics.com">
	<link rel="canonical" href="https://diogocorrea.dev">
	<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
	<style>
		@font-face {font-family:'Montserrat'; src:url('montserrat.woff2') format('woff2'); font-display:swap; font-weight:normal; font-style:normal}
		body {
			font-family:'Montserrat', sans-serif;
			background:#1a1f30 center center no-repeat;
			background-image:url("bg.svg"), linear-gradient(to right top, #102142, #0f2a4c, #0d3355, #0a3c5f, #064568, #0f4568, #154667, #1a4667, #213d5c, #253551, #262d46, #25253b);
			background-size:contain;
			color:#EEFBFF;
			margin:0;
			display:grid;
			grid-template-rows:10vmin 1fr auto 10vmin;
			grid-template-columns:10vmin 1fr auto 10vmin;
			grid-template-areas:
				". . . ."
				". . footer ."
				". header header ."
				". . . .";
			opacity:0;
			transition:1s opacity;
			-webkit-transition:1s opacity;
			-webkit-font-smoothing:antialiased;
			font-smoothing:antialiased;
		}
		.visible {opacity:1}
		header {grid-area:header}
		footer {grid-area:footer; writing-mode:vertical-lr}
		h1, h2 {text-transform:uppercase; margin:0; font-weight:normal; text-shadow:0 0 10px 10px #1a1f30; line-height:1}
		h1 {font-size:38px; letter-spacing:1px}
		h2 {color:#99AEBB; font-size:12px; margin-left:3px}
		a {color:#EEFBFF; padding:15px; font-size:14px; display:inline-block; position:relative; left:18px; top:-15px}
	</style>
</head>
<body>
	<header>
		<h2>Senior Frontend Software Engineer</h2>
		<h1>Diogo Corrêa</h1>
	</header>
	<footer>
		<a href="https://www.linkedin.com/in/diogodca">LinkedIn</a>
		<a href="https://github.com/diogocorrea">GitHub</a>
	</footer>
	<script>
		const body = document.querySelector("body");
		window.onresize = function() {
			body.style.height = `${window.innerHeight}px`;
		}
		window.requestAnimationFrame(() => {
			window.onresize();
			body.classList.add("visible")
		});
		if ("serviceWorker" in navigator) {
			navigator.serviceWorker.register("/sw.js")
		}
	</script>
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-DCXK29LE1B"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('js', new Date());
		gtag('config', 'G-DCXK29LE1B');
		gtag('send', 'pageview');
	</script>
</body>
</html>
