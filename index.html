<!DOCTYPE html>
<html lang="en">
<head>
	<title>Diogo Corrêa - Senior Frontend Developer</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Diogo Corrêa - Front-end Developer">
	<meta name="theme-color" content="#fafafa">
	<link rel="shortcut icon" href="/favicon.ico">
	<link rel="manifest" href="/manifest.json">
	<link rel="preload" as="font" href="montserrat.woff2" type="font/woff2" crossorigin>
	<link rel="preconnect" href="https://www.google-analytics.com">
	<link rel="canonical" href="https://diogocorrea.dev">
	<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
	<style>
		@font-face {font-family:'Montserrat'; src:url('montserrat.woff2') format('woff2'); font-display:swap; font-weight:normal; font-style:normal}
		body {
			font-family:'Montserrat', sans-serif;
			background:#1a1f30 url("bg.svg") center center no-repeat;
			background-size:contain;
			color:#E9F2FF;
			margin:0;
			display:grid;
			grid-template-rows:10vmin 1fr auto 10vmin;
			grid-template-columns:10vmin 1fr auto 10vmin;
			grid-template-areas:
				". . . ."
				". . footer ."
				". header header ."
				". . . .";
			opacity:0;
			transition:1s opacity;
			-webkit-transition:1s opacity;
			-webkit-font-smoothing:antialiased;
			font-smoothing:antialiased
		}
		.visible {opacity:1}
		header {grid-area:header}
		footer {grid-area:footer; writing-mode:vertical-lr}
		h1, h2 {text-transform:uppercase; margin:0; font-weight:normal; text-shadow:0 0 10px 10px #1a1f30; line-height:1}
		h1 {font-size:38px; letter-spacing:1px}
		h2 {color:#A5B5CC; font-size:15px}
		a {color:#A5B5CC; padding:15px; font-size:14px; display:inline-block; position:relative; left:18px; top:-15px}
	</style>
</head>
<body>
	<header>
		<h2>Senior Front-end Developer</h2>
		<h1>Diogo Corrêa</h1>
	</header>
	<footer>
		<a href="https://www.linkedin.com/in/diogodca">LinkedIn</a>
		<a href="https://github.com/diogocorrea">GitHub</a>
	</footer>
	<script>
		(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
		(i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
		m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
		})(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
		ga('create', 'UA-22076067-1', 'auto');
		ga('send', 'pageview');
		const body = document.querySelector("body");
		window.onresize = function() {
		    body.style.height = `${window.innerHeight}px`;
		}
		window.requestAnimationFrame(() => {
			window.onresize();
			body.classList.add("visible")
		});
		if ("serviceWorker" in navigator) {
			navigator.serviceWorker.register("/sw.js")
		}
	</script>
</body>
</html>
