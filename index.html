<!DOCTYPE html>
<html lang="en">
<head>
	<title>Diogo Corrêa - Senior Frontend Engineer</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Diogo Corrêa - Sernior Frontend Software Engineer">
	<meta name="theme-color" content="#1B4163">
	<link rel="shortcut icon" href="/favicon.ico">
	<link rel="manifest" href="/manifest.json">
	<link rel="preload" as="font" href="montserrat.woff2" type="font/woff2" crossorigin>
	<link rel="preconnect" href="https://www.google-analytics.com">
	<link rel="canonical" href="https://diogocorrea.dev">
	<link rel="apple-touch-icon" sizes="192x192" href="/192.png">
	<style>
		@font-face {font-family:'Montserrat'; src:url('montserrat.woff2') format('woff2'); font-display:swap; font-weight:normal; font-style:normal}
		body {
			font-family:'Montserrat', sans-serif;
			background:#1B4163 url("bg.svg") center right no-repeat;
			background-size:contain;
			color:#EEFBFF;
			margin:0;
			height:100vh;
			height:100dvh;
			display:grid;
			grid-template-rows:10vmin 1fr auto 10vmin;
			grid-template-columns:10vmin 1fr 1fr 10vmin;
			grid-template-areas:
				". . . ."
				". footer . ."
				". header . ."
				". . . .";
			opacity:0;
			transition:1s opacity;
			-webkit-transition:1s opacity;
			-webkit-font-smoothing:antialiased;
			font-smoothing:antialiased;
		}
		.visible {opacity:1}
		header {grid-area:header; display:flex; flex-direction:column-reverse}
		footer {grid-area:footer}
		h1 {font-size:84px; letter-spacing:1px; text-transform:uppercase; margin:0; font-weight:normal; text-shadow:0 0 10px 10px #1a1f30; line-height:0.9}
		h2 {color:#99AEBB; font-size:18px; line-height:1; margin:0 0 0 .5em; letter-spacing: 1.6px}
		a {color:#EEFBFF; padding:15px; font-size:14px; display:inline-block; position:relative; left:-15px; top:-15px}
		@media (max-width:800px) {
			body {
				background-position:center center;
				grid-template-areas:
				". . . ."
				". footer footer ."
				". header header ."
				". . . .";
			}
			h1 {font-size:56px}
			h2 {font-size:14px; letter-spacing:0}
		}
	</style>
</head>
<body>
	<header>
		<h1>Diogo <br>Corrêa</h1>
		<h2>Senior Frontend Engineer</h2>
	</header>
	<footer>
		<a href="https://www.linkedin.com/in/diogodca">LinkedIn</a>
		<a href="https://github.com/diogocorrea">GitHub</a>
	</footer>
	<script>
		window.requestAnimationFrame(() => {
			document.body.classList.add("visible")
		});
		if ("serviceWorker" in navigator) {
			navigator.serviceWorker.register("/sw.js")
		}
	</script>
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-DCXK29LE1B"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('js', new Date());
		gtag('config', 'G-DCXK29LE1B');
		gtag('send', 'pageview');
	</script>
</body>
</html>
