server {
    listen       80;
    server_name  diogocorrea.dev www.diogocorrea.dev diogocorrea.com.br www.diogocorrea.com.br;

    listen               443 ssl;
    ssl_certificate      /usr/share/nginx/cert/fullchain.pem;
    ssl_certificate_key  /usr/share/nginx/cert/privkey.pem;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        if ( $uri ~* \.(?:ico|css|js|gif|jpe?g|png|woff|ttf|otf|svg|woff2|eot) ) {
            expires 1y;
            add_header Pragma public;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }
    }
}
